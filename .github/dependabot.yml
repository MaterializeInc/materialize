- package-ecosystem: pip
  directory: /misc/dbt-materialize
  schedule:
    # dbt hardly changes, so this isn't too onerous and cuts down the latency
    # of releasing a new version of dbt-materialize when a new version of
    # dbt drops.
    interval: daily
  cooldown:
    default-days: 3
  labels: [A-dependencies]
  groups:
    simple:
      applies-to: version-updates
      update-types:
        - minor
        - patch
- package-ecosystem: docker
  directories:
    - /console
    - /console/misc/docker
    - /misc/images/materialized-base
    - /misc/images/debian-base
    - /misc/images/openssh-static
    - /misc/images/tini-static
    - /misc/images/distroless-prod-base
    - /misc/dbt-materialize
    - /ci/builder
    - /test
  schedule:
    interval: weekly
    day: sunday
    time: "22:00"
  # TODO: Add cooldown when https://github.com/dependabot/dependabot-core/issues/14044 is fixed
  open-pull-requests-limit: 50
  labels: [A-dependencies]
  groups:
    simple:
      applies-to: version-updates
