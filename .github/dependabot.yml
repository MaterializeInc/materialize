version: 2
updates:
# `/test/cargo-fuzz` is deliberately absent. The fuzz crates reach the root
# workspace through `path` dependencies, so dependabot resolves that directory to
# the root `Cargo.toml` and proposes edits to it while owning neither the root
# `Cargo.lock` nor the fuzz manifests. Every such PR fails `--locked` and
# duplicates the `/` PR for the same crate. Keeping the fuzz pins equal to the
# root is enforced by `check_fuzz_versions_mirror_root` in `bin/lint-cargo`
# instead, so a semver-incompatible root bump has to update the affected
# `src/*/fuzz/Cargo.toml` by hand in the same PR.
- package-ecosystem: cargo
  directories:
    - /
  schedule:
    interval: weekly
    day: sunday
    time: "22:00"
  cooldown:
    default-days: 3
  open-pull-requests-limit: 50
  labels: [A-dependencies]
  groups:
    simple1:
      applies-to: version-updates
      update-types:
        - patch
      patterns:
        - "a*"
        - "b*"
        - "c*"
        - "d*"
        - "e*"
        - "f*"
        - "g*"
        - "h*"
        - "i*"
        - "j*"
        - "k*"
        - "l*"
        - "m*"
    simple2:
      applies-to: version-updates
      update-types:
        - patch
      patterns:
        - "n*"
        - "o*"
        - "p*"
        - "q*"
        - "r*"
        - "s*"
        - "t*"
        - "u*"
        - "v*"
        - "w*"
        - "x*"
        - "y*"
        - "z*"
- package-ecosystem: cargo
  directory: /misc/wasm
  schedule:
    interval: weekly
    day: sunday
    time: "22:00"
  cooldown:
    default-days: 3
  open-pull-requests-limit: 50
  labels: [A-dependencies]
  groups:
    simple:
      applies-to: version-updates
      update-types:
        - minor
        - patch
# The `test/terraform` roots pin the self-managed modules to a tag rather than
# floating on `main`, so an upstream release arrives here as a PR that can
# adapt the roots in the same change, instead of breaking the nightly overnight
# with no PR-time signal. Pin to a tag, not a commit SHA: dependabot does not
# reliably bump SHA refs (dependabot/dependabot-core#10787).
- package-ecosystem: terraform
  directories:
    - /test/terraform/aws-temporary
    - /test/terraform/aws-upgrade
    - /test/terraform/aws-persistent
    - /test/terraform/gcp-temporary
    - /test/terraform/azure-temporary
  schedule:
    interval: weekly
    day: sunday
    time: "22:00"
  cooldown:
    default-days: 3
  open-pull-requests-limit: 50
  labels: [A-dependencies]
  # Each `module` block is its own dependency, so without a group every module
  # sourced from the same repository gets a separate PR. The modules of one
  # release must move together, so group all updates, including major ones,
  # across all roots into a single PR.
  groups:
    terraform:
      applies-to: version-updates
      patterns:
        - "*"
- package-ecosystem: pip
  directory: /misc/dbt-materialize
  schedule:
    # dbt hardly changes, so this isn't too onerous and cuts down the latency
    # of releasing a new version of dbt-materialize when a new version of
    # dbt drops.
    interval: daily
  cooldown:
    default-days: 3
  labels: [A-dependencies]
  groups:
    simple:
      applies-to: version-updates
      update-types:
        - minor
        - patch
- package-ecosystem: docker
  directories:
