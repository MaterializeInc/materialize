# Starts the CLA check in cla.yml for a pull request. A `pull_request` run gets
# no secrets and a read-only token on PRs from forks, so this workflow only
# exists for its completion to trigger cla.yml through `workflow_run`.
#
# NOTE: This workflow runs from the PR's merge commit, so a PR can change it.
# Its outcome must never decide the CLA check. The `cla-assistant` check comes
# from cla.yml, which always runs from the default branch.

name: CLA trigger

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  request:
    # Must not be named `cla-assistant`, or this job's own check run would
    # satisfy the required check of that name.
    name: request-cla-check
    runs-on: ubuntu-latest
    steps:
      - run: echo "cla.yml checks this pull request once this run completes."
