name: Claude Code

on:
  # GitHub treats PR timeline comments as issue comments. The job filters
  # out comments on plain issues.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    name: claude
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # Posts Claude's reply on PRs and reads PR context.
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The action checks out the PR branch itself, fetching fork PRs via
      # `refs/pull/N/head`. NOTE: Checking out the branch in an earlier step
      # breaks fork PRs, because git refuses to fetch into the checked-out
      # branch.
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1.0.251
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude reads PR content written by anyone, including forks. Without
          # this the action uses the Claude App token, which can push branches
          # and merge PRs. The job token cannot write repository contents.
          github_token: ${{ github.token }}
          claude_args: '--allowed-tools "Bash(gh pr view:*)" "Bash(gh pr diff:*)" "Bash(gh pr checks:*)" Edit Read Glob Grep'
