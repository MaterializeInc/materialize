# Deploys the docs to materialize.com/docs.

name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - doc/user/**
      - src/sql-lexer/src/keywords.txt
      - ci/builder/Dockerfile
      - ci/deploy_website/**
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions: {}

jobs:
  lint:
    name: Lint docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same check and image as the Buildkite lint-docs step.
      - run: bin/ci-builder run stable --no-secrets ci/test/lint-docs.sh

  deploy:
    name: Deploy docs
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Restricted to main; the AWS role trusts only this environment.
    environment: docs-production
    permissions:
      contents: read # check out the docs
      id-token: write # assume GithubActionsDocsDeploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            ci/builder
            ci/deploy_website
            doc/user
            misc/shlib
            src/sql-lexer
      - run: ci/deploy_website/install-tools.sh
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::834237029485:role/GithubActionsDocsDeploy
          aws-region: us-east-1
      - run: ci/deploy_website/website.sh
