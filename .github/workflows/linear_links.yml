# Rewrite bare Linear issue references (e.g. SS-319) in PR descriptions into
# Markdown links to https://linear.app/materializeinc/issue/<ref>.
#
# A `pull_request` run gets a read-only token on PRs from forks. A PR event
# runs linear_links_trigger.yml instead, and its completion runs this workflow
# from the default branch with a write token.

name: Linear Issue Links

on:
  workflow_run:
    workflows: [Linear Issue Links trigger]
    types: [completed]

permissions: {}

concurrency:
  group: linear-links-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  linkify:
    name: linkify
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Rewrites the PR description.
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!run.head_repository) {
              core.info('The head repository no longer exists.');
              return;
            }
            // `workflow_run.pull_requests` is empty for PRs from forks.
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
            });
            const pr = pulls.find(p => p.head.sha === run.head_sha);
            if (!pr) {
              core.info('No open pull request has this head commit.');
              return;
            }

            const body = pr.body;
            if (!body) {
              return;
            }

            const teamKeys = [
              'ANA', 'CDX', 'CLO', 'CLU', 'CNS', 'CPU', 'CS', 'DB', 'DEP',
              'DEX', 'EDU', 'GTM', 'MZC', 'OPE', 'PER', 'PRD', 'QAR', 'SAS',
              'SEC', 'SQL', 'SS', 'STG', 'WEB',
            ];

            // Don't touch code blocks, inline code, and URLs
            const skip = /(```[\s\S]*?```|`[^`\n]*`|https?:\/\/\S+)/;
            const ref = new RegExp(
              `(?<![\\w[-])(?:${teamKeys.join('|')})-\\d+(?![\\w-])`, 'g');

            const linked = body
              .split(skip)
              .map((segment, i) =>
                i % 2 === 1
                  ? segment
                  : segment.replace(
                      ref, '[$&](https://linear.app/materializeinc/issue/$&)'))
              .join('');

            if (linked !== body) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: linked,
              });
            }
