# Starts linear_links.yml for a pull request.

name: Linear Issue Links trigger

on:
  pull_request:
    types: [opened, edited]

permissions: {}

jobs:
  request:
    name: request-linear-links
    runs-on: ubuntu-latest
    steps:
      - run: echo "linear_links.yml rewrites this pull request's description once this run completes."
