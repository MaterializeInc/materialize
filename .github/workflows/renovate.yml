name: Renovate

on:
  pull_request:
    paths:
      - .github/renovate.json5
      - .github/workflows/renovate.yml

permissions: {}

env:
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
  RENOVATE_IMAGE: ghcr.io/renovatebot/renovate:44.226.1@sha256:aa5098ba76d1b499098c18f01d588bb078671b0c0cf8f32115148ea46e879f42

jobs:
  validate:
    name: Validate Renovate configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate configuration
        run: |
          docker run --rm --volume "$PWD:/workspace:ro" --workdir /workspace \
            --entrypoint renovate-config-validator "$RENOVATE_IMAGE" \
            --strict --no-global .github/renovate.json5
