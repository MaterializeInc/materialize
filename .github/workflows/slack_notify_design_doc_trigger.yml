# Starts slack_notify_design_doc.yml for a pull request.

name: Slack Design Doc Notifications trigger

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - "doc/developer/design/*.md"

permissions: {}

jobs:
  request:
    name: request-design-doc-notification
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "slack_notify_design_doc.yml checks this pull request once this run completes."
