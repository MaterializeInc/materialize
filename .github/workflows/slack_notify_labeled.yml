# Portions of this file are derived from the README examples in the Action
# Slack Notifier project. The original source code was retrieved on
# January 5, 2022 from:

#     https://github.com/actions-ecosystem/action-slack-notifier/blob/fc778468d09c43a6f4d1b8cccaca59766656996a/README.md

# Send a notification to the #release Slack channel when the `release-blocker`
# label is added to a PR.
#
# A `pull_request` run gets no secrets on PRs from forks. A PR event runs
# slack_notify_labeled_trigger.yml instead, and its completion runs this
# workflow from the default branch with secrets.

name: Slack Label Notifications

on:
  workflow_run:
    workflows: [Slack Label Notifications trigger]
    types: [completed]

permissions: {}

jobs:
  notify:
    name: notify
    # The trigger run is skipped for other labels.
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # Looks up the PR of the trigger run.
    steps:
      - name: Find pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!run.head_repository) {
              core.info('The head repository no longer exists.');
              return;
            }
            // `workflow_run.pull_requests` is empty for PRs from forks. Merged
            // PRs get the label too.
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
              per_page: 100,
            });
            // A push before this run moves the PR's head, so fall back to the
            // branch's only open PR.
            const open = pulls.filter(p => p.state === 'open');
            const pr = pulls.find(p => p.head.sha === run.head_sha)
              ?? (open.length === 1 ? open[0] : undefined);
            if (!pr) {
              core.info('No pull request matches this run.');
              return;
            }
            // A PR can change its trigger workflow, so the label is checked here.
            if (!pr.labels.some(l => l.name === 'release-blocker')) {
              return;
            }
            const assignee = pr.assignee?.login ?? 'unassigned';
            core.setOutput(
              'message',
              `\`release-blocker\` label has been added to "${pr.title}" (${pr.html_url}) (assigned to: ${assignee}).`,
            );
      - uses: actions-ecosystem/action-slack-notifier@fc778468d09c43a6f4d1b8cccaca59766656996a # v1.1.0
        if: steps.pr.outputs.message
        with:
          slack_token: ${{ secrets.SLACK_TOKEN }}
          channel: release
          message: ${{ steps.pr.outputs.message }}
          color: red
          verbose: false
