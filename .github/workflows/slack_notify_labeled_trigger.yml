# Starts slack_notify_labeled.yml for a pull request.

name: Slack Label Notifications trigger

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  request:
    name: request-label-notification
    if: github.event.label.name == 'release-blocker'
    runs-on: ubuntu-latest
    steps:
      - run: echo "slack_notify_labeled.yml notifies Slack about this pull request once this run completes."
