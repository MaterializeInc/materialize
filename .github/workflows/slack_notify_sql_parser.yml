# Portions of this file are derived from the README examples in the Action
# Slack Notifier project. The original source code was retrieved on
# January 5, 2022 from:
#
#     https://github.com/actions-ecosystem/action-slack-notifier/blob/fc778468d09c43a6f4d1b8cccaca59766656996a/README.md

# Send a notification to the #rnd-sql-council Slack channel when a change
# to the SQL parser or the system catalog schema is made.
#
# A notification is sent when all of these conditions are true:
#   * A ready-to-review PR is (re-)opened, or a PR is moved from draft
#     to ready-to-review.
#   * The PR modifies a file other than 'Cargo.toml' in 'src/sql-parser/' or
#     'src/sql-lexer/', or modifies 'src/catalog/src/builtin.rs' or
#     'test/sqllogictest/mz_catalog_server_index_accounting.slt'.
#
# A `pull_request` run gets no secrets on PRs from forks. A PR event runs
# slack_notify_sql_parser_trigger.yml instead, and its completion runs this
# workflow from the default branch with secrets.

name: Slack SQL Council Notifications

on:
  workflow_run:
    workflows: [Slack SQL Council Notifications trigger]
    types: [completed]

permissions: {}

jobs:
  notify:
    name: "Notify about changes to the SQL parser"
    # The trigger run is skipped for draft PRs.
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # Looks up the PR of the trigger run and its files.
    steps:
      - name: "Path filter"
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!run.head_repository) {
              core.info('The head repository no longer exists.');
              return;
            }
            // `workflow_run.pull_requests` is empty for PRs from forks.
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
            });
            // A push before this run moves the PR's head, so fall back to the
            // branch's only open PR.
            const open = pulls.filter(p => p.state === 'open');
            const pr = pulls.find(p => p.head.sha === run.head_sha)
              ?? (open.length === 1 ? open[0] : undefined);
            if (!pr || pr.draft) {
              core.info('No ready-to-review pull request matches this run.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const names = files.map(f => f.filename);
            const sqlParser = names.some(
              f => /^src\/sql-(parser|lexer)\//.test(f) && !f.endsWith('/Cargo.toml'),
            );
            const systemCatalog = names.some(
              f => f === 'src/catalog/src/builtin.rs'
                || f === 'test/sqllogictest/mz_catalog_server_index_accounting.slt',
            );
            if (!sqlParser && !systemCatalog) {
              return;
            }

            const kind = sqlParser ? 'SQL parser' : 'system catalog';
            const section = text => ({ type: 'section', text: { type: 'mrkdwn', text } });
            core.setOutput('payload', JSON.stringify({
              blocks: [
                section(`A new ${kind} change is ready for review!`),
                section(`• *PR:* <${pr.html_url}|${pr.title}>`),
                section(`• *Author:* <${pr.user.html_url}|${pr.user.login}>`),
              ],
            }));
      - name: "Push to Slack"
        if: steps.pr.outputs.payload
        uses: actions-ecosystem/action-slack-notifier@fc778468d09c43a6f4d1b8cccaca59766656996a
        with:
          slack_token: ${{ secrets.SLACK_TOKEN }}
          channel: rnd-sql-council
          custom_payload: ${{ steps.pr.outputs.payload }}
