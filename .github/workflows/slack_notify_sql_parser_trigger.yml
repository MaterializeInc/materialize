# Starts slack_notify_sql_parser.yml for a pull request.

name: Slack SQL Council Notifications trigger

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - "src/sql-parser/**"
      - "src/sql-lexer/**"
      - "src/catalog/src/builtin.rs"
      - test/sqllogictest/mz_catalog_server_index_accounting.slt

permissions: {}

jobs:
  request:
    name: request-sql-council-notification
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "slack_notify_sql_parser.yml checks this pull request once this run completes."
