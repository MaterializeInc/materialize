# Re-resolved every 10s, so a balancerd service whose address changes is
# followed without a restart. The certificate is not verified, as with
# nginx's proxy_pass to an https backend.
[upstreams.environmentd]
addrs = ["$ENV:MZ_CONSOLE_BACKEND_ADDR"]
discovery = "dns"
update_frequency = "10s"
sni = "$ENV:MZ_CONSOLE_BACKEND_SNI"
verify_cert = false
