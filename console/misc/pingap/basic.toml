# Shared by every directory under /etc/pingap. PINGAP_CONF picks one
# directory, and pingap merges the .toml files in it.

[basic]
name = "console"
log_level = "info"
pid_file = "/tmp/pingap.pid"
upgrade_sock = "/tmp/pingap_upgrade.sock"
