# Holds every table that depends on the listener's scheme. pingap reads all
# tables from every file; only the file names must be its own, or it tries
# to rewrite the directory at start.

[servers.console]
addr = "$ENV:MZ_CONSOLE_LISTEN_ADDR"
locations = ["api", "oauth_metadata", "metrics_loopback", "static", "app"]
prometheus_metrics = "/_mz_console_metrics"
access_log = "combined"
global_certificates = true

# The secret is mounted 0440 root:<fsGroup>, so the process needs that
# supplementary group. The files are read once at start.
[certificates.console]
tls_cert = "$FILE:/nginx/tls/tls.crt"
tls_key = "$FILE:/nginx/tls/tls.key"
is_default = true

# Plain HTTP whether or not the console serves TLS.
[servers.metrics]
addr = "$ENV:MZ_CONSOLE_METRICS_LISTEN_ADDR"
locations = ["metrics", "metrics_not_found"]

# Loopback to our own certificate, whose name is not "localhost". The
# default TCP health check would log a failed TLS handshake every 10s.
[upstreams.console_self]
addrs = ["$ENV:MZ_CONSOLE_LOOPBACK_ADDR"]
sni = "localhost"
verify_cert = false
health_check = "https://localhost/?check_frequency=30s"
