[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[bans]
multiple-versions = "deny"
# Try to avoid exemptions for duplicate dependencies! Duplicate dependencies
# slow down compilation, bloat the binary, and tickle race conditions in `cargo
# doc` (see rust-lang/cargo#3613).
#
# If possible, submit PRs upstream to remove duplicated transitive dependencies.
# You can use patch directives in the root Cargo.toml to point at a
# Materialize-maintained fork that avoids the duplicated transitive
# dependencies.
skip = [
    # arrayvec had a significant API change in 0.7
    { name = "arrayvec", version = "0.5.2" },
    # One-time exception for base64 due to its prevalence in the crate graph.
    { name = "base64", version = "0.13.1" },
    # `syn` is a core crate that a huge part of the ecosystem either directly, or
    # transitively depends on, so major versions linger for years. We are on v3;
    # roughly 60 transitive dependencies still pull v2, among them `prost-build`,
    # `tonic-build`, `kube-derive`, `zerocopy-derive`, and `tracing-attributes`.
    # A few stragglers still pull v1.
    { name = "syn", version = "1.0.107" },
    { name = "syn", version = "2.0.119" },
    # `prettyplease` exposes `syn` types in its API, so `prost-build` holds the
    # v2-based release back until it moves to `syn` v3.
    { name = "prettyplease", version = "0.2.37" },
    # held back by thrift 0.17.0 depended on by parquet 51.0.0
    { name = "ordered-float", version = "2.10.1" },
    { name = "ordered-float", version = "4.6.0" },
    # Will require updating many crates
    { name = "indexmap", version = "1.9.1" },
    # Required by indexmap 1.9.1, which is depended on by many things
    { name = "hashbrown", version = "0.12.3" },
    { name = "hashbrown", version = "0.14.5" },
    # Required by hashbrown
    { name = "foldhash", version = "0.1.5" },

    # Had to update `tower-http` to `0.4.3` to fix the `base64` duplicate version
    # but this introduced a new dependency on `bitflags 2.3.3` but all the rest of
    # our crates use `bitflags 1.3.2`
    # TODO: fork `tower-http` and swap to use older bitflags
    { name = "bitflags", version = "1.3.2" },

    # TODO: Required for Rust nightly upgrade
    { name = "http", version = "0.2.9" },

    # There are many external crates that rely on 0.10.5. Upgrading them should
    # be its own PR.
    { name = "itertools", version = "0.10.5" },

    # A few crates -> `num_enum_derive` -> `proc-macro-crate` -> `toml_edit v0.19.14`.
    { name = "toml_edit", version = "0.19.14" },
    { name = "toml_datetime", version = "0.6.11" },
    { name = "winnow", version = "0.5.4" },

    { name = "memmap2", version = "0.5.4" },

    { name = "getrandom", version = "0.2.10" },
    { name = "rand", version = "0.8.5" },
    { name = "rand_chacha", version = "0.3.0" },
    { name = "rand_core", version = "0.6.2" },
    # Used by reqwest
    { name = "thiserror", version = "1.0.61" },
    { name = "thiserror-impl", version = "1.0.61" },
    { name = "unicode-width", version = "0.1.10" },
    # Used by rdkafka-sys
    { name = "num_enum", version = "0.5.11" },
    { name = "num_enum_derive", version = "0.5.11" },
    { name = "proc-macro-crate", version = "1.3.1" },
    # Used by tempfile
    { name = "linux-raw-sys", version = "0.4.15" },
    { name = "rustix", version = "0.38.44" },
    # Used by bindgen
    { name = "itertools", version = "0.13.0" },
    # Used by launchdarkly-server-sdk-evaluation, prost-build, prost-derive and
    # timely
    { name = "itertools", version = "0.14.0" },
    # Used by pprof
    { name = "nix", version = "0.26.4" },
    # tokio-tungstenite still pulls 0.29.
    { name = "tungstenite", version = "0.29.0" },
    # libduckdb-sys still pulls 6.
    { name = "zip", version = "6.0.0" },
    # launchdarkly-server-sdk still uses 0.16, up to its latest release 3.3.
    { name = "lru", version = "0.16.3" },
    # flate2 is on 0.9, while apache-avro and backtrace still pull 0.8.
    { name = "miniz_oxide", version = "0.8.9" },
    # reqsign-core is on 0.7, while opendal still pulls 0.6.
    { name = "asyncband", version = "0.6.7" },
    # rand 0.9 is still used by apache-avro, governor, iceberg, k8s-controller,
    # launchdarkly-server-sdk, mysql_async, opentelemetry_sdk, proptest,
    # rand_distr, retry-policies, tokio-postgres, tower-sessions-core,
    # tungstenite and turmoil. rand_core 0.9 is also used by imbl.
    { name = "rand", version = "0.9.4" },
    { name = "rand_core", version = "0.9.3" },
    # Used by tokio-postgres (MaterializeInc/rust-postgres fork)
    { name = "phf", version = "0.13.1" },
    { name = "phf_shared", version = "0.13.1" },
    # Used by iceberg, iceberg-catalog-rest, libduckdb-sys (build), segment, and
    # the iceberg connection code in mz-storage-types, whose client crosses into
    # iceberg's API.
    { name = "reqwest", version = "0.12.28" },
    # Conflicts between `bon` in apache-avro and `derive_builder` in iceberg
    { name = "darling_macro", version = "0.20.11" },
    { name = "darling_core", version = "0.20.11" },
    { name = "darling", version = "0.20.11" },
    { name = "darling_macro", version = "0.21.2" },
    { name = "darling_core", version = "0.21.2" },
    { name = "darling", version = "0.21.2" },
    # `kube-derive` and `serde_with_macros` are still on the `syn` v2 release.
    { name = "darling_macro", version = "0.23.0" },
    { name = "darling_core", version = "0.23.0" },
    { name = "darling", version = "0.23.0" },
    { name = "typed-builder", version = "0.20.1" },
    { name = "typed-builder-macro", version = "0.20.1" },
    # chrono-tz
    { name = "phf", version = "0.12.1" },
    { name = "phf_shared", version = "0.12.1" },
    { name = "phf_generator", version = "0.12.1" },
    { name = "phf_codegen", version = "0.12.1" },
    # duckdb
    { name = "fallible-iterator", version = "0.3.0" },
    # arrow
    { name = "hashbrown", version = "0.16.1" },
    { name = "hashbrown", version = "0.17.1" },
    # duckdb pins arrow 57 while the workspace is on 58, so mz-testdrive links
    # both majors. They never meet: duckdb's arrow stays inside duckdb's own API.
    { name = "arrow", version = "57.1.0" },
    { name = "arrow-arith", version = "57.1.0" },
    { name = "arrow-array", version = "57.2.0" },
    { name = "arrow-buffer", version = "57.3.0" },
    { name = "arrow-cast", version = "57.2.0" },
    { name = "arrow-data", version = "57.2.0" },
    { name = "arrow-ord", version = "57.2.0" },
    { name = "arrow-row", version = "57.1.0" },
    { name = "arrow-schema", version = "57.2.0" },
    { name = "arrow-select", version = "57.2.0" },
    { name = "arrow-string", version = "57.1.0" },
    # base64 0.22 is still used by arrow, axum, eventsource-client, gcp_auth,
    # headers, iceberg, jsonwebtoken, kube, mysql_common, parquet, pem 3,
    # postgres-protocol, prost-reflect, reqwest 0.12, tonic, tower-http,
    # tower-sessions-core and typespec.
    { name = "base64", version = "0.22.1" },
    # The previous generation of the RustCrypto crates is still used by
    # apache-avro, aws-config, axum, azure_core, crc-fast, headers,
    # launchdarkly-server-sdk-evaluation, mysql_common, pest_meta, tungstenite,
    # and the RustCrypto signature, key and cipher crates (ecdsa, elliptic-curve,
    # p256, p384, p521, pbkdf2, pkcs5, rsa, rfc6979, scrypt, ssh-key and
    # friends).
    { name = "block-buffer", version = "0.10.4" },
    { name = "const-oid", version = "0.9.6" },
    { name = "crypto-common", version = "0.1.6" },
    { name = "digest", version = "0.10.7" },
    { name = "hmac", version = "0.12.1" },
    { name = "sha1", version = "0.10.6" },
    { name = "sha2", version = "0.10.9" },
    # reqsign-azure-storage 3.2 moved to pem 4, while jsonwebtoken, and so most
    # of the workspace, is still on pem 3. The ADLS credential loader needs the
    # `expires_at` field that 3.2 added to `Credential::SasToken`, so the older
    # reqsign that would converge here is not an option.
    { name = "pem", version = "4.0.0" },
    # Held back by parquet 58. parquet 60 moves to 0.14.
    { name = "lz4_flex", version = "0.13.1" },
    # gcp_auth → hyper-rustls → rustls-native-certs pulls newer versions
    # while native-tls still pulls older versions.
    { name = "core-foundation", version = "0.10.1" },
    # aws-lc-rs (via jsonwebtoken 10) and ring pull different `untrusted`.
    { name = "untrusted", version = "0.7.1" },
    # Held back by lazy_static 1.4.0 (used by num-bigint-dig).
    { name = "spin", version = "0.5.2" },
    # held back by tower-lsp 0.20 (mz-deploy LSP server)
    { name = "dashmap", version = "5.5.3" },
    { name = "tower", version = "0.4.13" },
    # held back by duckdb 1.4 (rusqlite in mz-deploy's build cache is on 0.12)
    { name = "hashlink", version = "0.10.0" },
    # held back by owo-colors 4.3 (mz-deploy terminal styling)
    { name = "supports-color", version = "2.1.0" },
    # held back by insta 1.48
    { name = "similar", version = "2.7.0" },
    # held back by bindgen 0.72, the build dependency of custom-labels 0.4.6
    { name = "shlex", version = "1.3.0" },

    # Pulled by launchdarkly-server-sdk 3.x via launchdarkly-sdk-transport /
    # eventsource-client (proxy/timeout/rustls stack and the SDK's RNG path).
    # NB: tower 0.4.13 is already skipped above (mz-deploy).
    { name = "getrandom", version = "0.4.2" },
    { name = "cpufeatures", version = "0.3.0" },
]

[[bans.deny]]
crate = "crossbeam-channel@0.5.14"
reason = "memory corruption, https://github.com/MaterializeInc/database-issues/issues/9091"

# Use `tracing` instead.
[[bans.deny]]
name = "env_logger"

# Use `md-5` instead, which is part of the RustCrypto ecosystem.
[[bans.deny]]
name = "md5"

# Use `sha1` instead, which the RustCrypto ecosystem recently took control of.
# `sha-1` is the older and now deprecated name.
[[bans.deny]]
name = "sha-1"

# Use `prost` or `protobuf-native` instead. Two exceptions:
# - `prometheus` itself, whose `proto` types (used to encode/decode the
#   Prometheus protobuf format) are generated by protobuf.
# - `mz-prometheus-protobuf`, a tiny wrapper crate that owns the decode
#   helper around `prometheus::proto::MetricFamily`. No other workspace
#   crate should depend on `protobuf` directly.
[[bans.deny]]
name = "protobuf"
wrappers = ["prometheus", "mz-prometheus-protobuf"]

# Strum has suspect code quality and includes many unneeded features. Use
# more targeted enum macro crates, e.g. `enum-kinds`.
[[bans.deny]]
name = "strum"
wrappers = [
    "apache-avro",
    "iceberg",
    "duckdb",
]
[[bans.deny]]
name = "strum-macros"

[[bans.deny]]
name = "log"
wrappers = [
    "apache-avro",
    "bindgen",
    "buildid",
    "cookie_store",
    "deadpool-postgres",
    "eventsource-client",
    "fail",
    "globset",
    "hyper-rustls",
    "launchdarkly-server-sdk",
    "launchdarkly-server-sdk-evaluation",
    "launchdarkly-sdk-transport",
    "native-tls",
    "opendal-core",
    "opendal-layer-retry",
    "opendal-service-azdls",
    "opendal-service-gcs",
    "opendal-service-s3",
    "os_info",
    "postgres",
    "pprof",
    "prost-build",
    # TODO(guswynn): switch to tracing in rdkafka
    "rdkafka",
    "reqsign-aws-core",
    "reqsign-aws-v4",
    "reqsign-azure-storage",
    "reqsign-core",
    "reqsign-google",
    "reqwest",
    "rustls",
    "rustls-platform-verifier",
    "sqlparser",
    "tokio-postgres",
    "tokio-tungstenite",
    "tracing-log",
    "tracing",
    "tungstenite",
    "want",
    "zopfli",
]

# once_cell is going to be added to std, and doesn't use macros
# Unfortunately, its heavily used, so we have lots of exceptions.
[[bans.deny]]
name = "lazy_static"
wrappers = [
    "dynfmt",
    "findshlibs",
    "launchdarkly-server-sdk-evaluation",
    "num-bigint-dig",
    "prometheus",
    "sharded-slab",
]

# The `uncased` crate serves the same purpose as `unicase` and is more
# actively maintained.
[[bans.deny]]
name = "unicase"
wrappers = [
    "mime_guess",
    "pulldown-cmark",
]

# We shouldn't manually vendor `protoc`, instead rely on it through `mz-build-tools`.
[[bans.deny]]
name = "protobuf-src"
wrappers = [
    "mz-build-tools",
    "protobuf-native",
]

[advisories]
version = 2
ignore = [
    # Consider `encoding_rs` instead of `encoding` (unmaintained)
    "RUSTSEC-2021-0153",
    # `proc-macro-error2` (the maintained fork of `proc-macro-error`) is now also
    # unmaintained. Pulled in transitively via `tabled` -> `tabled_derive`. No
    # safe upgrade is available.
    "RUSTSEC-2026-0173",
    # `derivative` is unmaintained; consider using an alternative (unmaintained)
    "RUSTSEC-2024-0388",
    # The creator of the crate `paste` has stated in the [`README.md`](https://github.com/dtolnay/paste/blob/master/README.md) that this project is not longer maintained as well as archived the repository
    "RUSTSEC-2024-0436",
    # Bincode is unmaintained, the team considers version 1.3.3 a complete version of bincode that is not in need of any updates.
    "RUSTSEC-2025-0141",
    # rand unsoundness when a custom logger accesses ThreadRng during reseeding.
    # Affects transitive deps (rand 0.8.5 via fail/quickcheck/etc).
    "RUSTSEC-2026-0097",
    # Allows private key leakage through timing information
    # rsa is required through iceberg-storage-opendal
    "RUSTSEC-2023-0071",
    # `launchdarkly-server-sdk` requires `lru ^0.16.3` in its latest release.
    "RUSTSEC-2026-0253",
]

# Must be manually kept in sync with about.toml.
# See: https://github.com/EmbarkStudios/cargo-about/issues/201
[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "CC0-1.0",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ICU",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
]
# copyleft is denied by default
private = { ignore = true }
[[licenses.clarify]]
name = "ring"
expression = "ISC"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
# Do not allow non-MaterializeInc Git repositories here! Git repositories must
# be owned by the MaterializeInc organization so that maintainership is shared
# amongst Materialize employees and so that historical versions of Materialize
# remain buildable even if upstream Git repositories disappear. If you don't
# have permissions to create a fork in the MaterializeInc organization, ask in
# #eng-infra on Slack.
allow-org = { github = ["MaterializeInc"] }
