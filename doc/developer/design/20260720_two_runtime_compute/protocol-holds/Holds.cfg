\* The design: `AllowCompaction` goes to both runtimes, and the rendering runtime
\* holds every shared collection at the last frontier IT has applied.
\*
\* The invariant that buys: a shared arrangement compacts only as fast as the
\* slowest runtime's stream position (I1c). That is derived from the importing
\* runtime rather than from the controller's per-dataflow bookkeeping (I1a), which
\* is the requirement, and it is what a single-stream replica always had.
\*
\* Two processes is the smallest size that can express G1, since the failure is
\* process 1 having no ordering against process 0.
\*
\* MaxEpochs = 0 disables reconnection. G2 is therefore NOT covered here, though a
\* standing hold has no holder identity to go stale across one: see the README.
SPECIFICATION FairSpec

CONSTANTS
    Procs = {0, 1}
    Times = {0, 1, 2}
    Mechanism = "broadcast-standing"
    MaxEpochs = 0
    \* Outside Times, and larger, so it reads as "permits all compaction".
    NoTime = 9

CONSTRAINT QueuesBounded

INVARIANT TypeOK
INVARIANT I1
INVARIANT I1c
INVARIANT NoRegression

\* Liveness, so PROPERTY rather than INVARIANT. The lagging state this excludes is
\* legal and expected, so a safety version would flag it.
PROPERTY CompactionNotStalled
