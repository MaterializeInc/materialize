\* The proposal: AcquireHolds on maintenance's ordered stream.
\*
\* Two processes is the smallest size that can express G1, since the failure is
\* process 1 having no ordering against process 0.
\*
\* MaxEpochs = 0 disables reconnection. G2 is therefore NOT covered here: see the
\* README for why modelling it needs epoch-scoped holder identity first.
SPECIFICATION FairSpec

CONSTANTS
    Procs = {0, 1}
    Times = {0, 1, 2}
    Mechanism = "acquire"
    MaxEpochs = 0
    \* Outside Times, and larger, so it reads as "permits all compaction".
    NoTime = 9

CONSTRAINT QueuesBounded

INVARIANT TypeOK
INVARIANT I1
INVARIANT HoldNeverPassesReader
INVARIANT NoRegression
INVARIANT LagNeverExposes

\* Liveness, so PROPERTY rather than INVARIANT. See the comment on it: reclaim and
\* downgrade are separate steps, so any safety version would flag the legal state
\* between them.
PROPERTY NoPermanentPin
