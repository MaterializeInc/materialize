\* The ALTERNATIVE, without its hold: `AllowCompaction` is handed to both runtimes
\* and nothing else is added. Expected to VIOLATE I1.
\*
\* This is the claim "broadcast alone is enough" made checkable. Restoring the
\* ordering within each runtime's stream does not restore it BETWEEN them: the two
\* still drain at their own rates, so the owning runtime can realize a frontier the
\* rendering runtime has not applied, and in the window after the controller drops
\* its own hold there is nothing left to protect a reader that is still live on a
\* process which has not yet applied the drop.
SPECIFICATION Spec

CONSTANTS
    Procs = {0, 1}
    Times = {0, 1, 2}
    Mechanism = "broadcast"
    MaxEpochs = 0
    NoTime = 9

CONSTRAINT QueuesBounded

INVARIANT TypeOK
INVARIANT I1
