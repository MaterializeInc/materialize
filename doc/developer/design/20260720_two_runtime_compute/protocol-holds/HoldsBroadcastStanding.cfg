\* The ALTERNATIVE: `AllowCompaction` goes to both runtimes, and the rendering
\* runtime holds every shared collection at the last frontier IT has applied.
\*
\* The invariant that buys: a shared arrangement compacts only as fast as the
\* slowest runtime's stream position. That is derived from the importer rather than
\* from the controller's per-dataflow bookkeeping (I1a), which is the requirement,
\* and it is what a single-stream replica always had.
\*
\* No acquisition, no release, no reclaim, so `HoldNeverPassesReader` and
\* `NoPermanentPin` have no subject here: there is no separate hold to outrun its
\* reader or to be left behind. `LagNeverExposes` likewise asserts something about
\* a queued acquisition that this mechanism never sends.
SPECIFICATION Spec

CONSTANTS
    Procs = {0, 1}
    Times = {0, 1, 2}
    Mechanism = "broadcast-standing"
    MaxEpochs = 0
    NoTime = 9

CONSTRAINT QueuesBounded

INVARIANT TypeOK
INVARIANT I1
INVARIANT NoRegression
