\* The RETIRED mechanism: the multiplexer caps AllowCompaction and retires the cap
\* when interactive reports a frontier. Expected to VIOLATE I1.
\*
\* This exists so a green run of Holds.cfg means something. A model that can only
\* express the proposed design cannot tell you the design fixed anything.
SPECIFICATION Spec

CONSTANTS
    Procs = {0, 1}
    Times = {0, 1, 2}
    Mechanism = "cap"
    MaxEpochs = 0
    NoTime = 9

CONSTRAINT QueuesBounded

INVARIANT TypeOK
INVARIANT I1
