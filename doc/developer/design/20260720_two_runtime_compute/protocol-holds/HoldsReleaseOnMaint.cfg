\* The REFUTED ordering: the release travels on the stream of the runtime that OWNS
\* the held collections, rather than the one that renders the holder. Expected to
\* VIOLATE I1.
\*
\* A release on that stream can overtake a create the rendering runtime has not
\* processed, so the owning runtime applies acquire, release and compaction while the
\* dataflow is still queued, and the dataflow then renders against compacted data.
\* The asymmetry in the shipped code exists for this reason alone, so it is checked
\* here rather than merely asserted in a comment.
SPECIFICATION Spec

CONSTANTS
    Procs = {0, 1}
    Times = {0, 1, 2}
    Mechanism = "release-on-maint"
    MaxEpochs = 0
    NoTime = 9

CONSTRAINT QueuesBounded

INVARIANT TypeOK
INVARIANT I1
