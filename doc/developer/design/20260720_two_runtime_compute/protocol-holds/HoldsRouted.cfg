\* The raw defect: `AllowCompaction` is routed to the owning runtime alone, as
\* routing by ownership does, and nothing else is added. Expected to VIOLATE I1.
\*
\* This is the state the runtime split created and the reason this work exists. It
\* fails in the same window `HoldsBroadcast.cfg` does, which is the point of
\* checking both: broadcasting the command changes the ordering within each stream
\* and buys nothing at all for this counterexample.
SPECIFICATION Spec

CONSTANTS
    Procs = {0, 1}
    Times = {0, 1, 2}
    Mechanism = "routed"
    MaxEpochs = 0
    NoTime = 9

CONSTRAINT QueuesBounded

INVARIANT TypeOK
INVARIANT I1
