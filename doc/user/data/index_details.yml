# Manifest of reusable index content included by the indexes concept page,
# rendered with the `include-from-yaml` shortcode. Related cluster-topic
# entries (cross-cluster accessibility of tables/views/materialized views)
# live in cluster_details.yml.

- name: definition
  content: |
    Materialize indexes maintain the full result set of the indexed object in
    the memory of the [cluster](/concepts/clusters/) where the index is created.
    The cluster's workers keep the indexed results up-to-date as new data
    arrives. Like clustered[^db-term] hash indexes, Materialize indexes store
    the indexed results themselves and are efficient for equality lookups on the
    full index key. Materialize indexes are not themselves hash indexes; hashing
    is used only to distribute the index across the cluster's workers.

    ![Materialize index maintains the full result set in memory](/images/indexes/index_in_memory.svg)

    Materialize indexes are **not** secondary indexes that store the index keys
    and pointers to data rows.

    ![Materialize indexes do not use a key-pointer structure.](/images/indexes/index_not_key_pointer.svg)

    [^db-term]: The term *clustered
    index* is a database term unrelated to Materialize clusters, which are
    compute resources.

# Shared with the clusters concept page, which composes it after the
# cross-cluster-accessibility entry in cluster_details.yml. Renders on both
# the clusters and indexes pages, so avoid page-root links to either page;
# deep anchor links (e.g., #resource-isolation) are fine. On clusters.md
# they act as same-page jumps.
- name: index-cluster-local
  content: |
    Indexes are accessible only from their own cluster. Indexed results reside
    in the memory of the cluster where the index is created, and a [cluster's
    memory](/concepts/clusters/#resource-isolation) cannot be accessed from
    another cluster.

# Creation-order semantics for index reuse. The hydration page's "index-order"
# strategy bullet (concepts/hydration.md) states the same create-before-
# consumers rule; keep them consistent.
- name: index-reuse
  content: |
    Within a cluster, an index can be used not only by ad-hoc queries but also
    by other indexes and materialized views. For an index or materialized view
    to use another index, however, that index must exist when the dependent
    object is created. That is:

    - When you create an index or a materialized view, Materialize plans how
      to compute its results at creation time. As part of planning, Materialize
      checks whether it can reuse an **existing** index in the **same**
      cluster.

    - Because the plan is bound at creation time, creation order matters. An
      index or materialized view that is already running will **not** adopt an
      index created afterward. To have an existing index or materialized view
      use a newer index, drop and recreate the existing object. However,
      recreating an index or a materialized view triggers
      [hydration](/concepts/hydration/#when-hydration-occurs).

    Ad-hoc queries, by contrast, are planned at query time. They can use any
    index that exists in the cluster when the query runs.

    {{< note >}}
    Reusing an index saves computation since the dependent objects read the
    index's maintained results instead of recomputing them from the base data.
    However, each new index has costs related to cluster memory and ongoing
    maintenance, especially indexes on regular views.
    {{< /note >}}

- name: index-key-distribution
  content: |
    The index data is distributed across the cluster's
    workers by a hash of the key, which spreads the maintenance and lookup work
    across the cluster.

- name: index-key-ordering-within-workers
  content: |
    Within each worker, index keys are ordered by their internal representation
    (the encoded key's length, then its bytes), not by the data types' natural
    ordering.

# GROUP BY gets no index-specific optimization: the reduce operator always
# builds and maintains its own arrangement keyed by the grouping key, so an
# index on the grouping key does not reduce aggregation work. Single
# paragraph (>-): nested via the {{< >}} angle form inside the GROUP BY
# bullet of the index-not-optimized entry below, and rendered inline after
# "No." on transform-data/faq.md.
- name: index-groupby-not-optimized
  content: >-
    An index on the grouping key does not reduce the work of computing the
    aggregation: Materialize reads the full index and maintains the
    aggregation separately.

# Consumers: concepts/indexes.md and transform-data/optimization.md, both
# under a "Limitations" heading. On optimization.md the list renders with no
# supporting context, so each bullet must stay self-contained and carry its
# own reason where one is needed. The GROUP BY bullet nests the
# index-groupby-not-optimized entry above; it must use the {{< >}} angle
# form (the {{% %}} form ejects the nested content out of the list).
- name: index-not-optimized
  content: |
    Materialize indexes are not optimized for:

    - Ordered access, including:

      - Range queries, that is, queries using `>`, `>=`, `<`, `<=`, or `BETWEEN`
        (e.g., `WHERE quantity > 10`, `WHERE price >= 10 AND price <= 50`, and
        `WHERE quantity BETWEEN 10 AND 20`).

      - Queries that use `ORDER BY` on the index key.

    - Lookups on a prefix of a multi-column index key. For example, an index
      with the key `(a, b)` is not optimized for a query that specifies an
      equality condition on `a` but not on `b`.

    - Lookups that do not match the exact index key expression. For example,
      for an index with the key `lower(a)`, an equality condition on `a` does
      not match the index key; the query must specify an equality condition on
      `lower(a)` for a point lookup.

    - `GROUP BY` aggregations. {{< include-from-yaml data="index_details" name="index-groupby-not-optimized" >}}
