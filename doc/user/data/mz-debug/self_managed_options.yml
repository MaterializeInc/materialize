columns:
  - column: "Option"
  - column: "Description"
rows:
  - Option: "`--k8s-namespace <NAMESPACE>`"
    Description: |

      <a name="k8s-namespace"></a> **Required**. The Kubernetes namespace of the Materialize instance.

  - Option: "`--mz-instance-name <MZ_INSTANCE_NAME>`"
    Description: |

      <a name="mz-instance-name"></a> **Required**. The Materialize instance to target.

  - Option: "`--k8s-context <CONTEXT>`"
    Description: |

      <a name="k8s-context"></a> The Kubernetes context to use.

      Defaults to the `KUBERNETES_CONTEXT` environment variable.

  - Option: "`--debug-name <NAME>`"
    Description: |

      <a name="debug-name"></a> The name of the `MaterializeDebug` resource to
      download from, when it differs from the instance name. The operator names
      the resource it creates for an instance after the instance.

  - Option: "`--dump-k8s <boolean>`"
    Description: |

      <a name="dump-k8s"></a>
      If `true`, the fresh snapshot includes Kubernetes resources, their
      describe output, and pod logs.

      Defaults to `true`.

  - Option: "`--all-snapshots`"
    Description: |

      <a name="all-snapshots"></a> Download every snapshot the collector has
      retained, not only the latest.

  - Option: "`--no-fresh-snapshot`"
    Description: |

      <a name="no-fresh-snapshot"></a> Do not ask the collector for a fresh
      snapshot; download what it has already collected.

  - Option: "`--snapshot-timeout-seconds <SECONDS>`"
    Description: |

      <a name="snapshot-timeout-seconds"></a> How long to wait for the fresh
      snapshot before falling back to the latest snapshot the collector has.

      Defaults to `600`.

  - Option: "`-h`, `--help`"
    Description: |

      <a name="help"></a> Print help information.
