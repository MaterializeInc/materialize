- key: operator.args.statementLoggingMaxSampleRate
  type: float
  notationtype: ""
  autodefault: ""
  default: '`0.1`'
  autodescription: Caps the fraction of statements recorded in query history, via environmentd's `statement_logging_max_sample_rate`. Sampling costs CPU on environmentd, and the recorded history is retained for the lifetime of the environment, so this samples a fraction of statements rather than environmentd's own default of 0.99. This bounds the sampled fraction, not the total size of the history. Sustained write volume is capped separately by `statement_logging_target_data_rate`, which is the binding limit on busy environments. Raise this for more complete query history, set it to `0` to disable statement logging entirely, or set it to `null` to inherit environmentd's default.
  description: ""
  section: ""
  column: 5
  linenumber: 50
  dependency: ""
  isglobal: false
- key: operator.args.statementLoggingTargetDataRate
  type: int
  notationtype: ""
  autodefault: ""
  default: '`nil`'
  autodescription: Caps the sustained volume statement logging writes, in bytes per second, via environmentd's `statement_logging_target_data_rate`. This is the binding limit on busy environments, where it throttles sampled statements that would exceed it. Lower it to hold query history growth down on environments with limited storage, keeping in mind that the recorded history is retained for the lifetime of the environment. Set it to `null` to inherit environmentd's default of 2071 bytes per second.
  description: Caps the sustained volume statement logging writes, in bytes per second, via environmentd's `statement_logging_target_data_rate`. This is the binding limit on busy environments, where it throttles sampled statements that would exceed it. Lower it to hold query history growth down on environments with limited storage, keeping in mind that the recorded history is retained for the lifetime of the environment. Set it to `null` to inherit environmentd's default of 2071 bytes per second.
  section: ""
  column: 5
  linenumber: 58
  dependency: ""
  isglobal: false
