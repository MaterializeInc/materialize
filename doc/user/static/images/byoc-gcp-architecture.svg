<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="BYOC on GCP architecture: a dedicated customer GCP project containing the VPC network, GKE, Cloud SQL, Cloud Storage, observability and ingress, alongside the Materialize control plane.">
  <defs>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>

  <rect width="980" height="600" fill="#FFFFFF"/>

  <!-- Customer project -->
  <rect x="10" y="10" width="560" height="575" rx="14" fill="#EEF3FE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="30" y="50" font-size="23" font-weight="700" fill="#1D4ED8">Customer GCP project (dedicated)</text>

  <rect x="30" y="68" width="520" height="426" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="48" y="98" font-size="17" font-weight="700" fill="#111827">VPC network</text>
  <text x="532" y="98" font-size="12.5" fill="#6B7280" text-anchor="end">subnets · /16 by default</text>

  <rect x="48" y="112" width="484" height="104" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="64" y="139" font-size="18" font-weight="700" fill="#111827">Google Kubernetes Engine</text>
  <text x="64" y="161" font-size="14.5" fill="#374151">Runs the Materialize instance + console</text>
  <text x="64" y="180" font-size="12.5" fill="#6B7280">auto-scaling node pools</text>
  <text x="64" y="198" font-size="12.5" fill="#6B7280">orchestratord · environmentd · clusterd · console</text>

  <rect x="48" y="228" width="236" height="86" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="64" y="255" font-size="17" font-weight="700" fill="#111827">Cloud SQL</text>
  <text x="64" y="277" font-size="14.5" fill="#374151">Metadata database</text>
  <text x="64" y="296" font-size="12.5" fill="#6B7280">consensus, per environment</text>

  <rect x="296" y="228" width="236" height="86" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="312" y="255" font-size="17" font-weight="700" fill="#111827">Cloud Storage</text>
  <text x="312" y="277" font-size="14.5" fill="#374151">Object storage</text>
  <text x="312" y="296" font-size="12.5" fill="#6B7280">CMEK via Cloud KMS, your key</text>

  <rect x="48" y="326" width="484" height="86" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="64" y="353" font-size="17" font-weight="700" fill="#111827">Observability</text>
  <text x="64" y="375" font-size="14.5" fill="#374151">In-project logs + metrics</text>
  <text x="64" y="394" font-size="12.5" fill="#6B7280">Loki · Thanos · Grafana with TLS</text>

  <rect x="48" y="424" width="484" height="56" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="64" y="447" font-size="14" font-weight="700" fill="#111827">Ingress</text>
  <text x="64" y="468" font-size="14.5" fill="#374151">Private Service Connect, or public with IP allowlisting</text>

  <text x="30" y="522" font-size="16" font-style="italic" fill="#2563EB">Customer data never leaves the account.</text>
  <text x="30" y="548" font-size="14.5" fill="#374151">Customers are responsible for connecting their applications</text>
  <text x="30" y="568" font-size="14.5" fill="#374151">and sources to the BYOC network.</text>

  <!-- Materialize control plane -->
  <rect x="700" y="95" width="270" height="260" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="722" y="140" font-size="23" font-weight="700" fill="#7C3AED">Materialize</text>
  <text x="722" y="174" font-size="17" font-weight="700" fill="#111827">Control plane</text>
  <text x="722" y="208" font-size="15" fill="#374151">Provisioning</text>
  <text x="722" y="238" font-size="15" fill="#374151">Upgrades, rolling, about weekly</text>
  <text x="722" y="268" font-size="15" fill="#374151">Monitoring</text>
  <text x="722" y="298" font-size="15" fill="#374151">Billing and Account Mgmt</text>

  <!-- Management arrow, control plane to customer project -->
  <line x1="690" y1="185" x2="580" y2="185" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="632" y="169" font-size="12" fill="#7C3AED" text-anchor="middle">manages environment</text>
  <text x="632" y="205" font-size="12" fill="#7C3AED" text-anchor="middle">admin via federation</text>

  <!-- Telemetry arrow, customer project to control plane -->
  <line x1="580" y1="300" x2="690" y2="300" stroke="#111827" stroke-width="2.5" marker-end="url(#arrowDark)"/>
  <text x="635" y="284" font-size="12.5" fill="#111827" text-anchor="middle">usage data</text>
  <text x="635" y="322" font-size="13.5" fill="#111827" text-anchor="middle">logs + metrics</text>
  <text x="635" y="341" font-size="11" fill="#6B7280" text-anchor="middle">mTLS, literals excluded</text>
  <text x="635" y="357" font-size="11" fill="#6B7280" text-anchor="middle">at the application level</text>
</svg>
