suite: test clusterrole
templates:
  - clusterrole.yaml
tests:
  - it: should create a clusterrole when RBAC is enabled
    set:
      rbac.create: true
    asserts:
      - isKind:
          of: ClusterRole
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["configmaps", "persistentvolumeclaims", "pods", "namespaces", "secrets", "serviceaccounts", "services"]
            verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["rbac.authorization.k8s.io"]
            resources: ["roles", "rolebindings"]
            verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
      # The operator creates ClusterRoleBindings for the debug collector. It
      # may only bind the named ClusterRoles, so it cannot hand its own
      # permissions to another subject.
      - contains:
          path: rules
          content:
            apiGroups: ["rbac.authorization.k8s.io"]
            resources: ["clusterrolebindings"]
            verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["rbac.authorization.k8s.io"]
            resources: ["clusterroles"]
            verbs: ["bind"]
            resourceNames: ["environmentd", "materialize-debug-collector", "materialize-debug-collector-cluster"]
      - contains:
          path: rules
          content:
            apiGroups: ["materialize.cloud"]
            resources: ["materializes", "materializes/status", "balancers", "balancers/status", "consoles", "consoles/status", "materializedebugs", "materializedebugs/status", "vpcendpoints"]
            verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]

  - it: should not create a clusterrole when RBAC is disabled
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0
