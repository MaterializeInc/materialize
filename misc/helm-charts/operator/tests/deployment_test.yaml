suite: test deployment
templates:
- deployment.yaml
tests:
- it: should create a deployment
  asserts:
  - isKind:
      of: Deployment
  - equal:
      path: spec.template.spec.containers[0].image
      value: materialize/orchestratord:v26.38.1
  - equal:
      path: spec.template.spec.containers[0].imagePullPolicy
      value: IfNotPresent
  - equal:
      path: spec.template.spec.serviceAccountName
      value: orchestratord

- it: should set ephemeral volume class when storage class is configured
  set:
    storage.storageClass.name: "my-storage-class"
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--ephemeral-volume-class=my-storage-class"

- it: should not set ephemeral volume class when storage class is not configured
  set:
    storage.storageClass.name: ""
  asserts:
  - notContains:
      path: spec.template.spec.containers[0].args
      content: "--ephemeral-volume-class"

- it: should set correct base arguments
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--startup-log-filter=INFO,mz_orchestratord=TRACE"

- it: should set a non-zero statement logging sample rate by default
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--statement-logging-max-sample-rate=0.99"

- it: should set a custom statement logging sample rate
  set:
    operator.args.statementLoggingMaxSampleRate: 0.5
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--statement-logging-max-sample-rate=0.5"

- it: should pass a zero statement logging sample rate to disable statement logging
  set:
    operator.args.statementLoggingMaxSampleRate: 0
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--statement-logging-max-sample-rate=0"

- it: should omit the statement logging sample rate when unset
  set:
    operator.args.statementLoggingMaxSampleRate: null
  asserts:
  - notContains:
      path: spec.template.spec.containers[0].args
      content: "--statement-logging-max-sample-rate=0.99"
  - notContains:
      path: spec.template.spec.containers[0].args
      content: "--statement-logging-max-sample-rate="

- it: should omit the statement logging target data rate by default
  asserts:
  - notContains:
      path: spec.template.spec.containers[0].args
      content: "--statement-logging-target-data-rate="

- it: should set a custom statement logging target data rate
  set:
    operator.args.statementLoggingTargetDataRate: 512
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--statement-logging-target-data-rate=512"

- it: should render a large statement logging target data rate as an integer
  values:
  - values/large-target-data-rate.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--statement-logging-target-data-rate=1048576"

- it: should set resources correctly
  asserts:
  - equal:
      path: spec.template.spec.containers[0].resources.requests.cpu
      value: 100m
  - equal:
      path: spec.template.spec.containers[0].resources.requests.memory
      value: 512Mi
  - equal:
      path: spec.template.spec.containers[0].resources.limits.memory
      value: 512Mi

- it: should set disk limit to 0 when no storage class is configured
  set:
    storage.storageClass.name: ""
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[0].args[13]      # Index of the environmentd-cluster-replica-sizes argument
      pattern: disk_limit":"0"
  - matchRegex:
      path: spec.template.spec.containers[0].args[13]
      pattern: is_cc":true

- it: should have a cluster with disk limit to 1552MiB when storage class is configured and swap disabled
  set:
    storage.storageClass.name: "my-storage-class"
    operator.clusters.swap_enabled: false
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[0].args[13]
      pattern: disk_limit":"1552MiB"
  - matchRegex:
      path: spec.template.spec.containers[0].args[13]
      pattern: is_cc":true
  - matchRegex:
      path: spec.template.spec.containers[0].args[13]
      pattern: materialize.cloud/scratch-fs":"true"

- it: should have a cluster with swap_enabled
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[0].args[13]
      pattern: is_cc":true
  - matchRegex:
      path: spec.template.spec.containers[0].args[13]
      pattern: swap_enabled":true
  - matchRegex:
      path: spec.template.spec.containers[0].args[13]
      pattern: materialize.cloud/swap":"true"

- it: should handle default of swap_enabled, but some sizes without
  set:
    operator.clusters.sizes.mysize:
      swap_enabled: false
      workers: 1
      scale: 1
      cpu_exclusive: false
      cpu_limit: 0.1
      credits_per_hour: "0.00"
      disk_limit: "1552MiB"
      memory_limit: "776MiB"
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[0].args[13]
      pattern: '"mysize":{"cpu_exclusive":false,"cpu_limit":0.1,"credits_per_hour":"0.00","disk_limit":"0","is_cc":true,"memory_limit":"776MiB","scale":1,"selectors":{},"swap_enabled":false,"workers":1}'
  - matchRegex:
      path: spec.template.spec.containers[0].args[13]
      pattern: swap_enabled":true
  - matchRegex:
      path: spec.template.spec.containers[0].args[13]
      pattern: materialize.cloud/swap":"true"

- it: should configure for AWS provider correctly
  set:
    operator.cloudProvider.type: "aws"
    operator.cloudProvider.region: "us-east-1"
    operator.cloudProvider.providers.aws:
      enabled: true
      accountID: "123456789012"
      iam:
        roles:
          environment: "arn:aws:iam::123456789012:role/env-role"
          connection: "arn:aws:iam::123456789012:role/conn-role"
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--cloud-provider=aws"
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--region=us-east-1"
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--aws-account-id=123456789012"
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--environmentd-iam-role-arn=arn:aws:iam::123456789012:role/env-role"
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--environmentd-connection-role-arn=arn:aws:iam::123456789012:role/conn-role"

- it: should configure for generic provider correctly
  set:
    operator.cloudProvider.type: "generic"
    operator.cloudProvider.region: "local"
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--cloud-provider=generic"
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--region=local"
  - notContains:
      path: spec.template.spec.containers[0].args
      content: "--aws-account-id"

  # Feature Flag Tests
- it: should enable balancer creation when configured
  set:
    balancerd.enabled: true
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--create-balancers"

- it: should not enable balancer creation when disabled
  set:
    balancerd.enabled: false
  asserts:
  - notContains:
      path: spec.template.spec.containers[0].args
      content: "--create-balancers"

- it: should enable console creation when configured
  set:
    console.enabled: true
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--create-console"

- it: should configure console image tag map override correctly
  set:
    console.imageTagMapOverride:
      "v0.125.0": "25.1.0"
      "v0.126.0": "25.2.0"
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--console-image-tag-map=v0.125.0=25.1.0"
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--console-image-tag-map=v0.126.0=25.2.0"

- it: should configure secrets controller kubernetes by default
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--secrets-controller=kubernetes"

- it: should configure secrets controller if overridden
  set:
    operator.secretsController: aws-secrets-manager
  asserts:
  - notContains:
      path: spec.template.spec.containers[0].args
      content: "--secrets-controller=kubernetes"
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--secrets-controller=aws-secrets-manager"

- it: should not pass the scheduler when not configured
  asserts:
  - notContains:
      path: spec.template.spec.containers[0].args
      content: "--scheduler-name"

- it: should pass the scheduler when configured
  set:
    schedulerName: my-scheduler
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--scheduler-name=my-scheduler"

- it: should have license key checks disabled by default
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: "--disable-license-key-checks"

- it: should support enabling license key checks
  set:
    operator.args.enableLicenseKeyChecks: true
  asserts:
  - notContains:
      path: spec.template.spec.containers[0].args
      content: "--disable-license-key-checks"

- it: should pass the pod name for the leader election identity
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ORCHESTRATORD_LEADER_ELECTION_IDENTITY
        valueFrom:
          fieldRef:
            fieldPath: metadata.name

- it: should spread replicas across nodes by default
  asserts:
  - equal:
      path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
      value: kubernetes.io/hostname
  - equal:
      path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchLabels["app.kubernetes.io/instance"]
      value: RELEASE-NAME

- it: should not spread a single replica
  set:
    operator.replicas: 1
  asserts:
  - notExists:
      path: spec.template.spec.affinity

- it: should let a configured affinity win over the default
  set:
    operator.affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/os
              operator: In
              values: [linux]
  asserts:
  - notExists:
      path: spec.template.spec.affinity.podAntiAffinity
  - exists:
      path: spec.template.spec.affinity.nodeAffinity

# The operator's shutdown sequence is bounded to 15 seconds, so this must not
# drop below that. See the template for the breakdown.
- it: should give the operator time to shut down gracefully
  asserts:
  - equal:
      path: spec.template.spec.terminationGracePeriodSeconds
      value: 30
