{{- if .Values.rbac.create }}
# Deliberately narrower than the operator's own role. The console reads the
# resources it displays, writes the small slice of the Materialize spec it
# exposes, and annotates environmentd pods so a system parameter edit is picked
# up promptly. It has no access to Secrets at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "orchestratord-console.fullname" . }}
  labels:
    {{- include "orchestratord-console.labels" . | nindent 4 }}
rules:
- apiGroups: ["materialize.cloud"]
  resources: ["materializes", "balancers", "consoles"]
  verbs: ["get", "list", "watch"]
# Rollouts, promotion, and the editable slice of the spec are all writes to the
# Materialize resource itself.
- apiGroups: ["materialize.cloud"]
  resources: ["materializes"]
  verbs: ["update", "patch"]
- apiGroups: ["apps"]
  resources: ["statefulsets", "deployments"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "services", "events"]
  verbs: ["get", "list", "watch"]
# Nudges the kubelet to re-project the system parameter ConfigMap. Patches the
# live pods only, never the pod template, so it cannot trigger a rollout.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["patch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update"]
{{- end }}
