apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orchestratord-console.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestratord-console.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "orchestratord-console.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orchestratord-console.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "orchestratord-console.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: console
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - "--listen-address=[::]:{{ .Values.service.port }}"
        - "--log-filter={{ .Values.logFilter }}"
        {{- if .Values.operatorNamespace }}
        - "--operator-namespace={{ .Values.operatorNamespace }}"
        {{- end }}
        ports:
        - containerPort: {{ .Values.service.port }}
          name: http
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 30
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
