apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: materialize
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        # Our own MinIO build (test/minio), because MinIO no longer publishes
        # images that can be pulled anonymously. It is published under every
        # Materialize release tag, so the tag names a Materialize release, not
        # a MinIO version.
        image: materialize/minio:v26.42.0
        command: [minio]
        args:
        - server
        - /data
        env:
        - name: MINIO_ROOT_USER
          value: "minio"
        - name: MINIO_ROOT_PASSWORD
          value: "minio123"
        ports:
        - containerPort: 9000
        volumeMounts:
        - name: storage
          mountPath: /data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: materialize
spec:
  ports:
    - port: 9000
      targetPort: 9000
  selector:
    app: minio
---
# The image has no `mc`, so this Job creates the buckets. It retries until
# MinIO answers, and `head-bucket` lets a restarted pod skip buckets that
# already exist.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  namespace: materialize
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: awscli
        image: amazon/aws-cli:2.31.19
        env:
        - name: AWS_ACCESS_KEY_ID
          value: "minio"
        - name: AWS_SECRET_ACCESS_KEY
          value: "minio123"
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        command: ["/bin/sh", "-c"]
        args:
        - |
          ep=http://minio.materialize.svc.cluster.local:9000
          for b in persist bucket; do
            until aws --endpoint-url "$ep" s3api head-bucket --bucket "$b" 2>/dev/null ||
                  aws --endpoint-url "$ep" s3 mb "s3://$b"; do
              echo "waiting for minio..."; sleep 3
            done
          done
