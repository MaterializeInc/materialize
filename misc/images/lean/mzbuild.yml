name: lean
description: Lean 4 toolchain and dependency closure for the models in misc/lean.
# Only the files that pin the toolchain and the dependencies are copied, so
# editing a model does not change the image fingerprint.
pre-image:
  - type: copy
    source: misc/lean
    destination: .
    matching: lean-toolchain
  - type: copy
    source: misc/lean
    destination: .
    matching: lakefile.lean
  - type: copy
    source: misc/lean
    destination: .
    matching: lake-manifest.json
