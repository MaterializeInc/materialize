[package]
name = "materialize-sdk-core"
description = "The protocol core of the Materialize SDK: SUBSCRIBE decoding, batch release, statements, checkpoints, and error classification, with no I/O."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# The runner of the conformance vectors, for the packages' tests.
conformance = []
# JSON Schemas of the values the core hands to bindings, for generating each
# package's types.
schema = ["dep:schemars"]

[dev-dependencies]
# Turns on `conformance` for the core's own tests.
materialize-sdk-core = { path = ".", features = ["conformance"] }
proptest.workspace = true
