[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "materialize-sdk"
description = "Consume Materialize SUBSCRIBE correctly."
version = "0.0.0"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["psycopg>=3.2"]

[project.optional-dependencies]
test = ["mypy>=1.13", "psycopg[binary]>=3.2", "pytest>=8"]

[tool.maturin]
module-name = "materialize_sdk._core"
python-source = "."
# A wheel leaves libpython to the interpreter that loads it.
features = ["pyo3/extension-module"]
