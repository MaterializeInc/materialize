# THROWAWAY spike guest: Valkey upsert sink. A workspace member so mzbuild can
# resolve it as a path dependency of the spike host.
[package]
name = "wasm-sink-guest"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow-array = { version = "58", default-features = false }
arrow-ipc = { version = "58", default-features = false }
arrow-cast = { version = "58", default-features = false }
arrow-schema = { version = "58", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.63"
