# THROWAWAY spike guest: Valkey upsert sink.
[package]
name = "wasm-sink-guest"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow-array = { version = "58", default-features = false }
arrow-ipc = { version = "58", default-features = false }
arrow-cast = { version = "58", default-features = false }
arrow-schema = { version = "58", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.63"

[profile.release]
opt-level = 3
debug = 0
strip = true

[workspace]
