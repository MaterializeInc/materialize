[package]
name = "mz-alloc"
description = "Chooses a global memory allocator based on Cargo features."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mz-ore = { path = "../ore", default-features = false }
mz-prof = { path = "../prof", default-features = false, features = ["jemalloc"], optional = true }
mz-prof-http = { path = "../prof-http", default-features = false }
# According to jemalloc developers, `background_threads` should always be
# enabled, except in "esoteric" situations that don't apply to Materialize
# (namely, if the application relies on new threads not being created for
# whatever reason).
#
# See: https://github.com/jemalloc/jemalloc/issues/956#issuecomment-316224733
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }
tikv-jemalloc-sys = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }
libmimalloc-sys = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[features]
default = []
# Whether to use jemalloc instead of the system allocator for Rust allocations,
# through the sampling allocation tracker.
jemalloc = ["tikv-jemallocator", "dep:tikv-jemalloc-ctl", "dep:tikv-jemalloc-sys", "mz-prof", "mz-prof-http/jemalloc", "mz-ore/alloc-track", "mz-prof-http/alloc-track"]
# Whether to use mimalloc instead of the system allocator for Rust allocations,
# through the sampling allocation tracker. mimalloc also replaces `malloc` for C
# dependencies. With `jemalloc` also enabled, the process name selects the
# allocator for Rust allocations, see the crate documentation.
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys", "dep:libc", "mz-ore/alloc-track", "mz-prof-http/alloc-track"]

[package.metadata.unused-deps]
# The only reason we depend on mz-prof-http from this package is so that we can
# force its `jemalloc` option to be enabled when this package's is, which makes
# all the Materialize binaries correctly serve heap profiling tools at the
# `/prof` endpoints.
ignore = ["mz-prof-http"]
