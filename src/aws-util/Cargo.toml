[package]
name = "mz-aws-util"
description = "AWS utilities."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
aws-config.workspace = true
aws-sdk-s3 = { workspace = true, optional = true }
aws-smithy-http-client.workspace = true
aws-smithy-runtime-api.workspace = true
aws-smithy-types = { workspace = true, features = ["http-body-1-x"] }
aws-types.workspace = true
bytes.workspace = true
bytesize.workspace = true
futures.workspace = true
http-body-util.workspace = true
mz-ore = { path = "../ore", features = ["async", "metrics", "network"], default-features = false }
pin-project.workspace = true
thiserror.workspace = true

[dev-dependencies]
aws-smithy-runtime-api = { workspace = true, features = ["test-util"] }
mz-ore = { path = "../ore", default-features = false, features = ["test"] }
tokio.workspace = true
uuid = { workspace = true, features = ["v4"] }

[features]
default = []
s3 = ["aws-sdk-s3"]
