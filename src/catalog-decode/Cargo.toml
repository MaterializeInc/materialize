[package]
name = "mz-catalog-decode"
description = "Decoders for durable catalog data, backing the catalog-raw SQL functions."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
hex.workspace = true
mz-ore = { path = "../ore", features = ["assert"] }
mz-repr = { path = "../repr" }
mz-sql-parser = { path = "../sql-parser" }
prost.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
mz-ore = { path = "../ore", features = ["test"] }

[features]
default = []
