[package]
name = "mz-clusterd"
description = "Materialize's cluster server."
version = "26.44.0-dev.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap = { workspace = true, features = ["env"] }
differential-dataflow.workspace = true
fail.workspace = true
futures.workspace = true
hyper.workspace = true
hyper-util.workspace = true
itertools.workspace = true
mz-alloc = { path = "../alloc" }
mz-alloc-default = { path = "../alloc-default", optional = true }
mz-build-info = { path = "../build-info" }
mz-catalog = { path = "../catalog" }
mz-cloud-resources = { path = "../cloud-resources" }
mz-cluster-client = { path = "../cluster-client" }
mz-compute = { path = "../compute", default-features = false }
mz-compute-client = { path = "../compute-client" }
mz-compute-types = { path = "../compute-types" }
mz-controller-types = { path = "../controller-types" }
mz-dyncfg = { path = "../dyncfg" }
mz-dyncfgs = { path = "../dyncfgs" }
mz-http-util = { path = "../http-util" }
mz-metrics = { path = "../metrics" }
mz-orchestrator-tracing = { path = "../orchestrator-tracing" }
mz-ore = { path = "../ore", features = ["async", "panic", "tracing"] }
mz-persist-client = { path = "../persist-client" }
mz-persist-types = { path = "../persist-types" }
mz-prof-http = { path = "../prof-http" }
mz-repr = { path = "../repr" }
mz-service = { path = "../service" }
mz-sql = { path = "../sql" }
mz-storage = { path = "../storage" }
mz-storage-client = { path = "../storage-client" }
mz-storage-types = { path = "../storage-types" }
mz-timely-util = { path = "../timely-util" }
mz-txn-wal = { path = "../txn-wal" }
num_cpus.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
timely.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
bytes.workspace = true
hex.workspace = true
mz-catalog = { path = "../catalog", features = ["test"] }
mz-expr = { path = "../expr" }
mz-persist = { path = "../persist" }
mz-persist-client = { path = "../persist-client", features = ["test"] }
mz-proto = { path = "../proto" }
mz-sql-parser = { path = "../sql-parser" }
prost.workspace = true

[build-dependencies]
custom-labels.workspace = true

[features]
default = ["tokio-console", "mz-alloc-default"]
jemalloc = ["mz-alloc/jemalloc"]
tokio-console = ["mz-ore/tokio-console"]

[package.metadata.unused-deps]
ignore = ["mz-alloc-default"]
