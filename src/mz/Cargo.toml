[package]
name = "mz"
description = "The Materialize command-line interface (CLI)."
license = "Apache-2.0"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
csv.workspace = true
dirs.workspace = true
indicatif.workspace = true
itertools.workspace = true
termcolor.workspace = true
maplit.workspace = true
mz-cloud-api = { path = "../cloud-api" }
mz-frontegg-client = { path = "../frontegg-client" }
mz-frontegg-auth = { path = "../frontegg-auth" }
mz-build-info = { path = "../build-info" }
mz-ore = { path = "../ore", features = ["async", "cli", "test"] }
mz-expr = { path = "../expr" }
mz-pgcopy = { path = "../pgcopy" }
mz-pgrepr = { path = "../pgrepr" }
mz-postgres-util = { path = "../postgres-util" }
mz-repr = { path = "../repr" }
mz-sql-parser = { path = "../sql-parser" }
mz-wasm-udf = { path = "../wasm-udf" }
mz-wasm-udf-abi = { path = "../wasm-udf-abi" }
open.workspace = true
openssl-probe.workspace = true
hyper.workspace = true
reqwest.workspace = true
rpassword.workspace = true
semver = { workspace = true, features = ["serde"] }
serde.workspace = true
serde-aux.workspace = true
serde_json.workspace = true
tabled.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
thiserror.workspace = true
uuid.workspace = true
url.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[package.metadata.deb]
name = "materialize-cli"
maintainer = "Materialize, Inc."
copyright = "Materialize, Inc. and contributors"
section = "utility"
assets = [
    ["target/release/mz", "usr/bin/", "755"],
]
depends = "postgresql-client, $auto"

[features]
default = []
