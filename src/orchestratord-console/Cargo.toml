[package]
name = "mz-orchestratord-console"
description = "Status API and web console for the Materialize Kubernetes operator"
version = "26.38.0-dev.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Named without the crate's `mz-` prefix, matching the operator's own binary.
[[bin]]
name = "orchestratord-console"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
futures.workspace = true
http.workspace = true
humantime.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
mz-cloud-resources = { path = "../cloud-resources", default-features = false }
mz-ore = { path = "../ore", default-features = false, features = ["panic"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }

[package.metadata.cargo-udeps.ignore]
normal = ["mz-ore"]
