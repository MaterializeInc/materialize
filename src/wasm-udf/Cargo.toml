[package]
name = "mz-wasm-udf"
description = "Deterministic WebAssembly runtime for arrow-udf scalar functions."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
itertools.workspace = true
mz-expr = { path = "../expr" }
mz-ore = { path = "../ore", features = ["process", "tracing"] }
mz-wasm-udf-abi = { path = "../wasm-udf-abi" }
stacker.workspace = true
thiserror.workspace = true
wasmparser.workspace = true
wasmtime = { workspace = true, features = ["anyhow", "backtrace", "call-hook", "cranelift", "runtime", "std"] }

[dev-dependencies]
mz-ore = { path = "../ore", features = ["test"] }

[features]
default = []
