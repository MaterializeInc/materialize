# Source: materialize-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-materialize-operator
  namespace: materialize
  labels:
    helm.sh/chart: materialize-operator-v26.46.0-dev.0
    app.kubernetes.io/name: materialize-operator
    app.kubernetes.io/instance: operator
    app.kubernetes.io/version: "v26.46.0-dev.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: materialize-operator
      app.kubernetes.io/instance: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: materialize-operator
        app.kubernetes.io/instance: operator
    spec:
      shareProcessNamespace: true
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsUser: 65532
        runAsNonRoot: true
      serviceAccountName: orchestratord
      # On SIGTERM the operator releases its leadership lease, then keeps
      # serving the conversion webhook for a few seconds while Kubernetes
      # removes it from the webhook service's endpoints, then drains the
      # in-flight conversion requests. Those steps run in sequence and are
      # individually bounded in the binary, adding up to 15 seconds. This is
      # set explicitly, rather than left to the Kubernetes default, so that the
      # budget the binary assumes cannot drift away from what it is given.
      terminationGracePeriodSeconds: 30
      # Spread the replicas across nodes by default, so that losing a single
      # node can't take down every replica of the conversion webhook. This is
      # a preference rather than a requirement, so that the operator still
      # schedules on single-node clusters.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: materialize-operator
                  app.kubernetes.io/instance: operator
      containers:
      - name: materialize-operator
        image: "us-central1-docker.pkg.dev/molten-verve-216720/materialize-repository/orchestratord:v26.46.0-dev.0--antithesis.g29fe0b7fd3a5"
        imagePullPolicy: IfNotPresent
        args:
        - "--helm-chart-version=v26.46.0-dev.0"
        - "--startup-log-filter=INFO,mz_orchestratord=DEBUG"
        - "--cloud-provider=local"
        - "--region=antithesis"
        - "--secrets-controller=kubernetes"
        - "--statement-logging-max-sample-rate=0"
        - "--orchestratord-pod-selector-labels=app.kubernetes.io/instance=operator"
        - "--orchestratord-pod-selector-labels=app.kubernetes.io/name=materialize-operator"
        - "--disable-license-key-checks"
        - "--disable-database-network-policies"

        

        

        
        - "--console-image-tag-default=v26.46.0-dev.0--antithesis.g29fe0b7fd3a5"

        
        - '--environmentd-cluster-replica-sizes={"antithesis-1":{"cpu_exclusive":false,"credits_per_hour":"0.00","disk_limit":"0","is_cc":true,"scale":1,"selectors":{},"swap_enabled":false,"workers":1},"antithesis-2":{"cpu_exclusive":false,"credits_per_hour":"0.00","disk_limit":"0","is_cc":true,"scale":1,"selectors":{},"swap_enabled":false,"workers":2},"antithesis-4":{"cpu_exclusive":false,"credits_per_hour":"0.00","disk_limit":"0","is_cc":true,"scale":1,"selectors":{},"swap_enabled":false,"workers":4}}'
        
        - "--bootstrap-default-cluster-replica-size=antithesis-1"
        
        - "--bootstrap-builtin-system-cluster-replica-size=antithesis-1"
        
        - "--bootstrap-builtin-probe-cluster-replica-size=antithesis-1"
        
        - "--bootstrap-builtin-support-cluster-replica-size=antithesis-1"
        
        - "--bootstrap-builtin-catalog-server-cluster-replica-size=antithesis-1"
        
        - "--bootstrap-builtin-analytics-cluster-replica-size=antithesis-1"
        
        - "--bootstrap-builtin-system-cluster-replication-factor=0"
        
        - "--bootstrap-builtin-probe-cluster-replication-factor=0"
        
        - "--bootstrap-builtin-support-cluster-replication-factor=0"
        
        - "--bootstrap-builtin-analytics-cluster-replication-factor=0"
        - "--image-pull-policy=if-not-present"
        - '--environmentd-default-resources={"limits":{"memory":"2Gi"},"requests":{"cpu":"50m","memory":"512Mi"}}'
        - '--balancerd-default-resources={"limits":{"memory":"256Mi"},"requests":{"cpu":"500m","memory":"256Mi"}}'
        - '--console-default-resources={"limits":{"memory":"256Mi"},"requests":{"cpu":"500m","memory":"256Mi"}}'

        
        
        
        - "--enable-security-context"
        env:
        # Sets the operator's --leader-election-identity, which must be unique
        # per replica.
        - name: ORCHESTRATORD_LEADER_ELECTION_IDENTITY
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 3100
          name: metrics
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 20m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
