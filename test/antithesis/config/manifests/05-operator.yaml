apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: operator-materialize-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: operator-materialize-operator
subjects:
- kind: ServiceAccount
  name: orchestratord
  namespace: materialize
