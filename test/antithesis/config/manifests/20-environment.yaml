---
# Synced into environmentd every second via `--config-sync-file-path`. The
# workload rewrites it to roll per-timeline system parameters.
apiVersion: v1
kind: ConfigMap
metadata:
  name: system-params
  namespace: materialize-environment
data:
  system-params.json: |
    {"cluster_soften_replication_anti_affinity": "true", "allowed_cluster_replica_sizes": "'antithesis-1', 'antithesis-2', 'antithesis-4'", "max_connections": "1000", "enable_session_timelines": "true", "allow_real_time_recency": "true", "with_0dt_deployment_ddl_check_interval": "30s", "with_0dt_deployment_max_wait": "20min"}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: materialize-cr
  namespace: materialize-environment
data:
  materialize.yaml: |
    apiVersion: materialize.cloud/v1alpha1
    kind: Materialize
    metadata:
      name: antithesis
      namespace: materialize-environment
    spec:
      environmentdImageRef: us-central1-docker.pkg.dev/molten-verve-216720/materialize-repository/environmentd:v26.45.1--antithesis.upgrade-base
      backendSecretName: materialize-backend
      authenticatorKind: None
      systemParameterConfigmapName: system-params
      rolloutStrategy: WaitUntilReady
      environmentdResourceRequirements:
        requests:
          cpu: 50m
          memory: 512Mi
        # Two generations run during a rollout, so the pair is bounded at
        # 4 GiB of the node's 10 GiB. An environmentd of this harness's
        # catalog size that needs more is worth a look, and the resource kill
        # check reports it as hitting its own limit.
        limits:
          memory: 2Gi
---
# Caps clusterd, whose replica sizes carry no memory_limit (see
# operator-values.yaml). Applies only to containers that set no memory
# request or limit of their own, which in this namespace are the clusterd
# containers. The small request keeps 30-odd replicas schedulable at rollout
# peak. The cap does not make the replicas' sum fit the node; it makes a
# runaway clusterd die at its own limit, where the resource kill check
# attributes it, instead of setting off a node-wide OOM whose victim is
# arbitrary. 1 GiB has not been measured against this workload.
apiVersion: v1
kind: LimitRange
metadata:
  name: clusterd-memory
  namespace: materialize-environment
spec:
  limits:
  - type: Container
    default:
      memory: 1Gi
    defaultRequest:
      memory: 64Mi
