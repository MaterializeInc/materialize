# Shared workspace for every cargo-fuzz crate (`src/*/fuzz`).
#
# The fuzz crates are excluded from the root workspace because libFuzzer
# requires a nightly toolchain and would break stable builds. They all share
# THIS workspace rather than each being its own. A per-crate workspace has to
# duplicate the parts of the root `Cargo.toml`'s `[patch.crates-io]` it needs,
# which silently drifts out of sync with the root (e.g. a stale `iceberg-rust`
# rev) and breaks builds. Sharing one workspace means a single
# `[patch.crates-io]` to keep in sync with the root, one `Cargo.lock`, and no
# per-crate duplication. Each fuzz crate points here via
# `package.workspace = "../../../test/cargo-fuzz"`.
#
# `[patch.crates-io]` below mirrors the root `Cargo.toml`'s, minus the root
# entries that no fuzz crate depends on (they would only trigger cargo's "patch
# was not used in the crate graph" warning). `bin/lint-cargo` lists those
# omissions and enforces that every other root entry is present here verbatim.
# If a fuzz crate gains a dependency on an omitted crate, copy its entry from the
# root and remove it from that list.

[workspace]
resolver = "2"
members = [
    "../../src/avro/fuzz",
    "../../src/catalog-protos/fuzz",
    "../../src/expr/fuzz",
    "../../src/interchange/fuzz",
    "../../src/mysql-util/fuzz",
    "../../src/persist-client/fuzz",
    "../../src/pgcopy/fuzz",
    "../../src/pgrepr/fuzz",
    "../../src/pgtz/fuzz",
    "../../src/pgwire/fuzz",
    "../../src/postgres-util/fuzz",
    "../../src/repr/fuzz",
    "../../src/sql-parser/fuzz",
    "../../src/sql-server-util/fuzz",
    "../../src/storage-types/fuzz",
    "../../src/storage/fuzz",
    "../../src/transform/fuzz",
]

[patch.crates-io]
# Waiting on https://github.com/sfackler/rust-postgres/pull/752.
postgres = { git = "https://github.com/MaterializeInc/rust-postgres", rev = "fcca71c8a6ee351eda7b6dfcd607055fa9a6d302" }
tokio-postgres = { git = "https://github.com/MaterializeInc/rust-postgres", rev = "fcca71c8a6ee351eda7b6dfcd607055fa9a6d302" }
postgres-protocol = { git = "https://github.com/MaterializeInc/rust-postgres", rev = "fcca71c8a6ee351eda7b6dfcd607055fa9a6d302" }
postgres-replication = { git = "https://github.com/MaterializeInc/rust-postgres", rev = "fcca71c8a6ee351eda7b6dfcd607055fa9a6d302" }
postgres-types = { git = "https://github.com/MaterializeInc/rust-postgres", rev = "fcca71c8a6ee351eda7b6dfcd607055fa9a6d302" }
postgres-openssl = { git = "https://github.com/MaterializeInc/rust-postgres", rev = "fcca71c8a6ee351eda7b6dfcd607055fa9a6d302" }

