chrono-tz = { git = "https://github.com/MaterializeInc/chrono-tz.git", rev = "1463cc380e9a2d842b9ed12cbe5952f983dc2b4a" }

# Waiting on https://github.com/MaterializeInc/serde-value/pull/35.
serde-value = { git = "https://github.com/MaterializeInc/serde-value.git", rev = "a84c6b71825efaffb332c0d19f18c2bdf9ee7b40" }

# Waiting on https://github.com/edenhill/librdkafka/pull/4051.
rdkafka = { git = "https://github.com/MaterializeInc/rust-rdkafka.git", rev = "526ad5e29cee12a5fc486fcdf03a1f8a9899509e" }
rdkafka-sys = { git = "https://github.com/MaterializeInc/rust-rdkafka.git", rev = "526ad5e29cee12a5fc486fcdf03a1f8a9899509e" }

