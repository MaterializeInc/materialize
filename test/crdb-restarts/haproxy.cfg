defaults
  mode tcp
  timeout connect 5s
  timeout client 300s
  timeout server 300s

frontend crdb
  bind *:26257
  default_backend crdb_nodes

backend crdb_nodes
  balance roundrobin
  server cockroach0 cockroach0:26257 check
  server cockroach1 cockroach1:26257 check
  server cockroach2 cockroach2:26257 check
  server cockroach3 cockroach3:26257 check
